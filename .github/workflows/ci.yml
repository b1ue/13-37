name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create isolated Python environment
        run: python3 -m venv .venv
      - name: Install pinned bridge dependencies
        run: .venv/bin/python -m pip install --disable-pip-version-check -r tools/requirements-stock-bridge-dev.txt
      - name: Run stock bridge tests
        working-directory: tools
        run: ../.venv/bin/python -m unittest -v test_stock_bridge.py

  firmware-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create isolated Python environment
        run: python3 -m venv .venv
      - name: Install pinned PlatformIO
        run: .venv/bin/python -m pip install --disable-pip-version-check platformio==6.1.18
      - name: Build firmware
        run: .venv/bin/pio run -j 2
